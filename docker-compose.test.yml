services:
  bazarr:
    image: ghcr.io/linuxserver/bazarr:v1.5.6-beta.5
    ports:
      - "16767:6767"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - bazarr-config:/config
      - ./tests/fixtures/config.yaml:/config/config/config.yaml

volumes:
  bazarr-config:
